<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
<include>/etc/fonts/fonts.conf</include>
<!-- Linux QA uses one deterministic substitute in BOTH renderers. DOCX keeps
     original Tahoma/Arial names; Windows uses the installed Microsoft fonts. -->
<match target="pattern"><test name="family" compare="eq"><string>Tahoma</string></test><edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit></match>
<match target="pattern"><test name="family" compare="eq"><string>Arial</string></test><edit name="family" mode="assign" binding="strong"><string>DejaVu Sans</string></edit></match>
</fontconfig>
