name: Build SchoolResult Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop/**'
      - 'source/src/engine.js'
      - 'source/src/report-print-batch.js'
      - 'source/src/report-download-pdf.js'
      - 'source/tests/report-vector-quality-6-10-53.cjs'
      - 'source/src/patches/ui.js'
      - 'source/tests/report-export-live-buttons-6-10-48.cjs'
      - 'source/tests/report-single-sheet-6-10-50.cjs'
      - 'source/tests/report-page-fit-6-10-51.cjs'
      - '.github/workflows/build-windows-setup.yml'
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Windows Setup and Portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm Desktop inputs
        shell: pwsh
        run: |
          $required = @(
            'package.json',
            'source/package.json',
            'desktop/package.json',
            'desktop/main.cjs',
            'desktop/server.cjs',
            'desktop/preload.cjs',
            'desktop/assets/icon.ico',
            'version.json'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing required file: $file" }
          }
          $webVersion = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $desktopVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($webVersion -ne $desktopVersion) {
            throw "Version mismatch: web=$webVersion, desktop=$desktopVersion"
          }
          Write-Host "Building SchoolResult $desktopVersion"

      - name: Install web build dependencies
        shell: pwsh
        run: npm --prefix source install --no-audit --no-fund

      - name: Verify web application and tests
        shell: pwsh
        run: npm run verify

      - name: Install Electron and electron-builder
        shell: pwsh
        run: npm --prefix desktop install --no-audit --no-fund

      - name: Verify Desktop startup and printing bridge
        shell: pwsh
        run: npm --prefix desktop run verify

      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: npm --prefix desktop run build:setup

      - name: Build Windows portable executable
        shell: pwsh
        run: npm --prefix desktop run build:portable

      - name: Confirm output and generate SHA256
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem 'desktop/dist' -File | Where-Object {
              $_.Name -like 'SchoolResult-Setup-*.exe' -or
              $_.Name -like 'SchoolResult-Portable-*.exe'
            }
          )
          if (@($files | Where-Object Name -Like 'SchoolResult-Setup-*.exe').Count -lt 1) {
            throw 'Windows installer was not produced.'
          }
          if (@($files | Where-Object Name -Like 'SchoolResult-Portable-*.exe').Count -lt 1) {
            throw 'Portable Windows executable was not produced.'
          }
          $lines = @(
            foreach ($file in $files) {
              $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
            }
          )
          $lines | Set-Content -Path 'desktop/dist/SHA256SUMS.txt' -Encoding ascii
          $lines | ForEach-Object { Write-Host $_ }

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: SchoolResult-Windows-${{ github.run_number }}
          path: |
            desktop/dist/SchoolResult-Setup-*.exe
            desktop/dist/SchoolResult-Portable-*.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
