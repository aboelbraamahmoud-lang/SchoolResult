name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

jobs:
  build-windows-setup:
    name: Build SchoolResult Setup
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      npm_config_audit: 'false'
      npm_config_fund: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Verify web source
        shell: pwsh
        run: |
          npm --prefix source ci
          npm run verify

      - name: Install Desktop build dependencies
        shell: pwsh
        run: npm --prefix desktop install --no-audit --no-fund

      - name: Desktop startup smoke test
        shell: pwsh
        run: npm --prefix desktop run verify

      - name: Build NSIS Setup
        shell: pwsh
        run: npm --prefix desktop run build:setup

      - name: Launch packaged app and reject immediate-exit builds
        shell: pwsh
        run: |
          $exe = Get-ChildItem desktop/dist/win-unpacked/SchoolResult.exe -ErrorAction Stop | Select-Object -First 1
          Write-Host "Launching packaged app: $($exe.FullName)"
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            throw "Packaged SchoolResult.exe exited immediately with code $($process.ExitCode). Setup will not be published."
          }
          Write-Host "Packaged app stayed running; immediate-startup crash test passed."
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Get-Process SchoolResult -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Create SHA256 file
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/SchoolResult-Setup-*.exe | Select-Object -First 1
          if (-not $setup) { throw 'Setup EXE was not produced.' }
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Out-File -FilePath desktop/dist/SHA256SUMS.txt -Encoding ascii
          Write-Host "Built: $($setup.FullName)"
          Get-Content desktop/dist/SHA256SUMS.txt

      - name: Upload Windows Setup
        uses: actions/upload-artifact@v7
        with:
          name: SchoolResult-Windows-Setup-v6.9.18
          path: |
            desktop/dist/SchoolResult-Setup-*.exe
            desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
