name: Build SchoolResult 6.9.10

on:
  push:
    branches: [main]
    paths:
      - 'release/SchoolResult-6.9.10.patch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schoolresult-6910
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH='release/SchoolResult-6.9.10.patch'
          echo '69d5a12c298cf52afec036753228c078fc3f891a0c232ef16ba95e5ee458bd5b  release/SchoolResult-6.9.10.patch' | sha256sum -c -
          git apply --check "$PATCH"
          git apply --whitespace=nowarn "$PATCH"

      - name: Build runtime
        run: cd source && node --expose-internals build.cjs

      - name: Regression tests
        run: cd source && node --expose-internals tests/regression.cjs

      - name: Cloud tests
        run: cd source && node --expose-internals tests/cloud.cjs

      - name: Structure tests
        run: cd source && node --expose-internals tests/structure.cjs

      - name: Generate release hashes
        run: cd source && node release.cjs

      - name: Release tests
        run: cd source && node tests/release.cjs

      - name: Commit verified 6.9.10
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build SchoolResult v6.9.10 — fix report logo and circles'
          git push origin HEAD:main
