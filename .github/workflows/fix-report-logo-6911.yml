name: Fix report Ministry logo 6.9.11

on:
  push:
    branches: [main]
    paths:
      - 'release/activate-6.9.11.txt'

permissions:
  contents: write

concurrency:
  group: schoolresult-6911
  cancel-in-progress: false

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          build=Path('source/build.cjs')
          s=build.read_text(encoding='utf-8')
          old="""const ministryEmblem='data:image/png;base64,'+fs.readFileSync('../moehe.png').toString('base64');
          const services=['engine.js','catalog.js','master-ui.js','dashboard-pro.js','cloud.js','backups.js','imports.js','reports.js','ui.js','cloud-ui.js'].filter(f=>fs.existsSync('src/'+f)).map(f=>fs.readFileSync('src/'+f,'utf8')).join('\\n').replace('__MOEHE_EMBLEM_DATA__',ministryEmblem);
          code=services+'\\n'+importOld+'\\n'+qualityOld+'\\n'+code;"""
          new="""const ministryEmblem='data:image/png;base64,'+fs.readFileSync('../moehe.png').toString('base64');
          const services=['engine.js','catalog.js','master-ui.js','dashboard-pro.js','cloud.js','backups.js','imports.js','reports.js','ui.js','cloud-ui.js'].filter(f=>fs.existsSync('src/'+f)).map(f=>fs.readFileSync('src/'+f,'utf8')).join('\\n');
          code=services+'\\nSR63.moeheEmblemData='+JSON.stringify(ministryEmblem)+';\\n'+importOld+'\\n'+qualityOld+'\\n'+code;"""
          if old not in s:
              raise SystemExit('Expected Ministry embed build block not found')
          s=s.replace(old,new,1)
          s=s.replace("replace('الإصدار 6.2 الاحترافي','الإصدار 6.9.10 — إصلاح شعار الوزارة ورأس التقارير');","replace('الإصدار 6.2 الاحترافي','الإصدار 6.9.11 — تثبيت شعار الوزارة في رأس التقارير');",1)
          build.write_text(s,encoding='utf-8')

          css=Path('source/src/repair.css')
          c=css.read_text(encoding='utf-8')
          marker='/* 6.9.11 — Ministry emblem placement and print-header stability. */'
          if marker not in c:
              c += '''\n\n/* 6.9.11 — Ministry emblem placement and print-header stability. */\n.report-ministry-lockup-official{min-height:10.5mm!important;display:flex!important;align-items:center!important;justify-content:flex-start!important}\n.report-ministry-emblem-official{display:block!important;width:49mm!important;max-width:49mm!important;height:10.3mm!important;max-height:10.3mm!important;object-fit:contain!important;object-position:right center!important}\n@media print{\n  .report-head-compact{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)!important;align-items:center!important}\n  .report-ministry-lockup-official{grid-column:auto!important;min-height:10.5mm!important}\n  .report-school-lockup{grid-column:auto!important}\n}\n'''
          css.write_text(c,encoding='utf-8')

          vp=Path('version.json')
          v=json.loads(vp.read_text(encoding='utf-8'))
          v['version']='6.9.11'
          v['notes']='إصلاح موضع شعار الوزارة: تضمين الشعار فعليًا داخل ملف التشغيل وتثبيت تخطيط رأس التقرير في المعاينة والطباعة.'
          vp.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          for name in ['README.md','source/README.txt','source/tests/release.cjs']:
              p=Path(name)
              t=p.read_text(encoding='utf-8').replace('6.9.10','6.9.11')
              p.write_text(t,encoding='utf-8')
          PY

      - name: Build runtime
        run: cd source && node --expose-internals build.cjs

      - name: Verify embedded Ministry logo
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('app.js','utf8');
          if(!app.includes('SR63.moeheEmblemData=') || !app.includes('data:image/png;base64,')) throw new Error('Embedded Ministry logo missing from app.js');
          if(app.includes('__MOEHE_EMBLEM_DATA__')) throw new Error('Unresolved Ministry logo placeholder');
          NODE

      - name: Regression tests
        run: cd source && node --expose-internals tests/regression.cjs

      - name: Cloud tests
        run: cd source && node --expose-internals tests/cloud.cjs

      - name: Structure tests
        run: cd source && node --expose-internals tests/structure.cjs

      - name: Generate release hashes
        run: cd source && node release.cjs

      - name: Release tests
        run: cd source && node tests/release.cjs

      - name: Commit verified 6.9.11
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build SchoolResult v6.9.11 — fix Ministry logo placement'
          git push origin HEAD:main
